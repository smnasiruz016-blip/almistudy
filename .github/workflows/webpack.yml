name: NodeJS with Webpack

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Build
      # RR-399 A8: .npmrc reads @smnasiruz016-blip/almi-data from GitHub Packages with ${NODE_AUTH_TOKEN}, which this job never set
      # (every run failed with 401). The owner stores a read-only packages token as the repo secret ALMI_DATA_TOKEN.
      env:
        NODE_AUTH_TOKEN: ${{ secrets.ALMI_DATA_TOKEN }}
      run: |
        npm install
        npx webpack
